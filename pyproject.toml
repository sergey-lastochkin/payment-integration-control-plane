[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


[project]
name = "1c-payment-orchestration"
version = "0.1.0"
description = "Исходящие платежи 1С: операция, состояния, аудит и сверка."
requires-python = ">=3.11"


[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.12,<1"]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

