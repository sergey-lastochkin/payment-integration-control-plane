[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "1c-payment-orchestration"
version = "0.1.0"
description = "Idempotent outgoing-payment orchestration for legacy 1C with a file-bank adapter, explicit state machine, audit trail, and reconciliation."
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
