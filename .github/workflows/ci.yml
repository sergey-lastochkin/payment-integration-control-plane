name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install project and test tools
        run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Lint
        run: python -m ruff check src tests failure_lab real_run
      - name: Tests
        run: PYTHONPATH=src python -m pytest
      - name: Compile Python sources
        run: python -m compileall -q src failure_lab real_run
      - name: Deterministic failure lab
        run: |
          run_root="$(mktemp -d)"
          PYTHONPATH=src python failure_lab/run.py --runs "$run_root" --run-id ci-smoke
